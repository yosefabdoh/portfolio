    <script>
      // Apply the saved theme and language before first paint.
      ;(function () {
        var root = document.documentElement
        try {
          var dark = localStorage.getItem('darkMode')
          if (dark === 'true' || (dark === null && matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark')
          }
          var lang = localStorage.getItem('lang')
          if (!lang && navigator.language && navigator.language.toLowerCase().indexOf('ar') === 0) lang = 'ar'
          if (lang === 'ar') {
            root.lang = 'ar'
            root.dir = 'rtl'
          }
        } catch (e) {}
      })()
    </script>
